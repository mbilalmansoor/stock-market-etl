name: Scheduled Stock ETL Sync

on:
  schedule:
    - cron: '0 4 * * 1-5'
  
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup uv Environment
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install Python 3.10
        run: uv python install 3.10

      - name: Sync Dependencies
        run: uv sync

      - name: Execute Daily Sync Pipeline Script
        run: uv run python cron_job.py

      - name: Commit and Push Updated DuckDB File
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          git add stock_data.duckdb

          git commit -m "database-update: dynamic cron ingestion [skip ci]" || echo "No data modifications encountered."

          git push
